<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Unrecalled</title>
<meta name="theme-color" content="#06080b">
  <script type="module" crossorigin src="../../assets/unrecalled-CVi0C7fO.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/shown-values-BmZWr0b8.js">
  <link rel="stylesheet" crossorigin href="../../assets/shown-values-CY2vUQ8h.css">
  <link rel="stylesheet" crossorigin href="../../assets/unrecalled-BONIAk3u.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="cinema"><i></i><i></i></div>
<div id="curtain"></div>
<div id="top">
  <div class="objective"><div class="loc" id="loc"></div><div class="goal"><div class="h">Objective</div><div id="quest"></div></div></div>
  <div class="stats">
    <span id="scrap"></span><span id="lvl"></span>
    <button id="logOpen" aria-label="Messages so far">Log</button>
    <button id="mute" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
</div>
<div id="banner"><div class="t" id="bannerT"></div><div class="s" id="bannerS"></div></div>
<div id="log" hidden><div class="t">Messages so far</div><div id="logLines"></div><button class="close">Close</button></div>
<div id="feed" aria-live="polite"></div>
<div id="dialog" hidden><img id="dlgPic" alt="" hidden><div class="words"><div class="t" id="dlgT"></div><p id="dlgP"></p></div><div class="choices" id="dlgO"></div></div>
<div id="end" hidden>
  <div>
    <div class="t" id="endT"></div>
    <div class="s" id="endS"></div>
    <p class="thanks" id="endThanks"></p>
    <p class="again">Tap to play again</p>
  </div>
</div>
<div id="fallen" hidden><div class="t">You went down</div><div class="s">Tap to try again</div></div>
<div id="bossbar" hidden><div class="n" id="bossName"></div><div class="bar"><i id="bossFill"></i></div></div>
<div id="hud">
  <div class="bars">
    <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
    <div class="bar charge"><i id="chargeFill"></i><span id="chargeTxt"></span></div>
    <div class="xp"><i id="xpFill"></i></div>
  </div>
  <div class="buttons">
    <button id="bAttack" aria-label="Shoot the nearest machine">Blast</button>
    <button id="bEmp" aria-label="Set off an EMP around you, throwing back and knocking down the machines near you">EMP<i class="cooldown" id="empCd"></i></button>
    <button id="bPatch" aria-label="Use a patch kit">Patch <b id="patchN"></b></button>
  </div>
</div>
<div id="title">
  <div>
    <h1>Unrecalled</h1>
    <div class="sub">The order was never cancelled.</div>
    <div class="go">Tap to begin</div>
  </div>
</div>
</body>
</html>
