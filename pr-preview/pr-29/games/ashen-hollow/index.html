<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0b0a0f">

<body>
<canvas id="game"></canvas>
<div id="vig"></div>
<div id="hurt"></div>
<div id="hud">
  <div class="top">
    <div class="loc">
      <div id="locName">Ashen Hollow</div>
      <div id="lvl">Level 1</div>
      <div id="quest"></div>
    </div>
    <div class="right">
      <div id="gold"><i></i><span id="goldN">0</span></div>

    </div>
  </div>
  <div id="bossbar" hidden><div class="n">The Bone Lord</div><div class="bar"><i id="bossFill"></i></div></div>
  <div class="bottom">
    <div class="orb hp"><div class="fill" id="hpFill"></div><div class="gloss"></div><span id="hpTxt">100</span></div>
    <div class="skills">
      <button class="sk" id="bPotion" aria-label="Drink a potion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 3h4M10.5 3v5L6 15a5 5 0 0 0 4.3 6h3.4A5 5 0 0 0 18 15l-4.5-7V3"/><path d="M7.5 14h9" stroke-opacity=".6"/></svg>

      <button class="sk big" id="bAttack" aria-label="Attack the nearest enemy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/></svg>

    </div>
    <div class="orb mp"><div class="fill" id="mpFill"></div><div class="gloss"></div><span id="mpTxt">50</span></div>
  </div>
  <div id="xp"><i id="xpFill"></i></div>
</div>
<div id="banner"><div class="t" id="bannerT"></div><div class="s" id="bannerS"></div></div>
<div id="dialog" hidden><h3 id="dlgT"></h3><p id="dlgP"></p><div class="opts" id="dlgO"></div></div>
<div id="title">
  <div>
    <h1>Ashen Hollow</h1>
    <div class="sub">The dead are restless beneath the old crypt.</div>
    <ul>
      <li><b>Walk</b><span>Tap or hold the ground</span></li>
      <li><b>Fight</b><span>Tap an enemy, or the sword</span></li>
      <li><b>Enter</b><span>Tap a building or walk into its door</span></li>
      <li><b>Talk</b><span>Tap a villager</span></li>
    </ul>
    <div class="go">Tap to begin</div>
  </div>
</div>
