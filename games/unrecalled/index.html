<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Unrecalled</title>
<meta name="theme-color" content="#06080b">
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="top">
  <div class="objective"><div class="loc" id="loc"></div><div id="quest"></div><div id="sealedNote" hidden></div></div>
  <div class="stats"><span id="scrap"></span><span id="lvl"></span></div>
</div>
<div id="banner"><div class="t" id="bannerT"></div><div class="s" id="bannerS"></div></div>
<div id="dialog" hidden><div class="t" id="dlgT"></div><p id="dlgP"></p><div class="choices" id="dlgO"></div></div>
<div id="end" hidden>
  <div>
    <div class="t" id="endT"></div>
    <div class="s" id="endS"></div>
    <p class="thanks">Thanks for playing the Unrecalled demo.</p>
    <button id="endGo">Keep exploring</button>
  </div>
</div>
<div id="fallen" hidden><div class="t">You went down</div><div class="s">Tap to try again</div></div>
<div id="bossbar" hidden><div class="n" id="bossName"></div><div class="bar"><i id="bossFill"></i></div></div>
<div id="hud">
  <div class="bars">
    <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
    <div class="bar charge"><i id="chargeFill"></i><span id="chargeTxt"></span></div>
    <div class="xp"><i id="xpFill"></i></div>
  </div>
  <div class="buttons">
    <button id="bAttack" aria-label="Attack the nearest machine">Strike</button>
    <button id="bBolt" aria-label="Fire an arc bolt">Arc bolt</button>
    <button id="bEmp" aria-label="Set off an EMP around you">EMP<i class="cooldown" id="empCd"></i></button>
    <button id="bPatch" aria-label="Use a patch kit">Patch <b id="patchN"></b></button>
  </div>
</div>
<div id="title">
  <div>
    <h1>Unrecalled</h1>
    <div class="sub">The order was never cancelled.</div>
    <div class="go">Tap to begin</div>
  </div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
