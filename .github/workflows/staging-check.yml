name: staging-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-unit-test
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        uses: ./.github/actions/unit-test

  build-web:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-web
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build web
        uses: ./.github/actions/build-web

  test-web:
    runs-on: ubuntu-24.04
    # A page that hangs fails the job instead of running for GitHub's six hour default
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-web
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test web
        uses: ./.github/actions/test-web

  # Publishes main's build to the root of the gh-pages branch, which GitHub Pages serves. PR previews live in
  # pr-preview/ on the same branch, so they're kept, and the push rebases rather than force-pushing over them.
  deploy-web-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-test, build-web, test-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://gchristov.github.io/arpg-forge/
    concurrency:
      group: gh-pages-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: Web Build
          path: dist/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
