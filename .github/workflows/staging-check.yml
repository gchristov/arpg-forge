name: staging-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-unit-test
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        uses: ./.github/actions/unit-test

  build-web:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-web
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build web
        uses: ./.github/actions/build-web

  test-web:
    runs-on: ubuntu-24.04
    # A page that hangs fails the job instead of running for GitHub's six hour default
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-web
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test web
        uses: ./.github/actions/test-web

  # Deploys the build to GitHub Pages, which serves the gh-pages branch: a pull request's build to its own preview
  # at pr-preview/pr-<number>/, and main's build to the root. The main deploy keeps pr-preview/ and rebases rather
  # than force-pushing, so it never removes open previews. staging-cleanup removes a preview when its PR closes.
  deploy-web-staging:
    needs: [build-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'github-pages' }}
      url: ${{ steps.preview.outputs.preview-url || 'https://gchristov.github.io/arpg-forge/' }}
    concurrency:
      group: gh-pages-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: Web Build
          path: dist/
      - name: Deploy preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
          wait-for-pages-deployment: true
          qr-code: true
      - name: Deploy main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
