name: 'build-web'
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: ./.github/actions/setup-node
    - name: Type check
      shell: bash
      run: npm run typecheck
    - name: Build
      shell: bash
      run: npm run build
    - name: Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Web Build
        path: dist/
        include-hidden-files: true # Keeps .nojekyll, so Pages serves the build as it is
