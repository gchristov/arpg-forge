name: 'unit-test'
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: ./.github/actions/setup-node
    - name: Test
      shell: bash
      run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
    - name: Generate test report
      uses: mikepenz/action-junit-report@v6
      if: always() # Ensure all test reports are collected, even after errors
      with:
        report_paths: 'test-results/junit.xml'
        check_name: unit-test-results
        include_passed: true
    - name: Artifacts
      uses: actions/upload-artifact@v7
      if: always() # Ensure all artifacts are collected, even after errors
      with:
        name: Tests
        path: test-results/
